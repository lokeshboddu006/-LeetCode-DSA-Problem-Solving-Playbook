name: Generate AI Explanation

on:
  push:
    branches:
      - main
    paths:
      - "**/*.java"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find problem to explain
        id: problem
        shell: bash
        run: |
          set -e

          echo "Event: ${{ github.event_name }}"

          # Supported solution file extensions.
          EXTENSIONS='\( -name "*.java" -o -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.py" \)'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual workflow run detected."
            echo "Finding the most recently modified solution file..."

            FILE=$(find . -type f \
              -not -path "./.git/*" \
              \( -name "*.java" -o -name "*.c" -o -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.py" \) \
              -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-)

          else

            echo "Push event detected."

            FILES=$(git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              -- \
              '*.java' \
              '*.c' \
              '*.cpp' \
              '*.cc' \
              '*.cxx' \
              '*.py' \
              || true)

            FILE=$(echo "$FILES" | grep -E '\.(java|c|cpp|cc|cxx|py)$' | head -n 1 || true)

          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: No supported solution file was found."
            echo "Supported languages: Java, C, C++, Python."
            exit 1
          fi

          PROBLEM_DIR=$(dirname "$FILE")
          README="$PROBLEM_DIR/README.md"

          echo "Solution file: $FILE"
          echo "Problem directory: $PROBLEM_DIR"
          echo "README file: $README"

          if [ ! -f "$README" ]; then
            echo "ERROR: README.md was not found."
            echo "Expected README at: $README"
            exit 1
          fi

          echo "solution_file=$FILE" >> "$GITHUB_OUTPUT"
          echo "problem_dir=$PROBLEM_DIR" >> "$GITHUB_OUTPUT"
          echo "readme_file=$README" >> "$GITHUB_OUTPUT"

      - name: Generate AI explanation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOLUTION_FILE: ${{ steps.problem.outputs.solution_file }}
          README_FILE: ${{ steps.problem.outputs.readme_file }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          solution_file = os.environ["SOLUTION_FILE"]
          readme_file = os.environ["README_FILE"]

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY GitHub Secret is missing."
              )

          print(f"Reading solution: {solution_file}")
          print(f"Reading README: {readme_file}")

          with open(solution_file, "r", encoding="utf-8") as f:
              solution = f.read()

          with open(readme_file, "r", encoding="utf-8") as f:
              readme = f.read()

          prompt = f"""
          You are a DSA revision assistant for a personal LeetCode problem-solving
          playbook.

          Your ONLY job is to explain the user's ACTUAL SUBMITTED SOLUTION.

          The submitted source code is the source of truth for the implementation.

          The user wants to understand THEIR OWN solution later when revising
          this problem months or years from now.

          STRICT RULES:

          1. Explain ONLY the submitted solution and the approach actually
             implemented in that solution.

          2. Do NOT replace the user's approach with the canonical LeetCode
             solution.

          3. Do NOT suggest a completely different algorithm.

          4. Do NOT suggest a different data structure as an alternative
             solution.

          5. Do NOT compare the user's solution against other people's
             solutions.

          6. Do NOT solve the problem independently and then explain a
             different solution.

          7. Do NOT invent implementation details.

          8. Every explanation must be grounded in the actual submitted
             source code.

          9. If the submitted solution contains a weakness, limitation,
             unnecessary operation, edge-case concern, or implementation
             issue, mention it honestly.

          10. Do NOT criticize the solution merely because another approach
              exists.

          11. Explain why the ACTUAL submitted code works.

          12. Complexity must correspond to the ACTUAL submitted code.

          13. Identify the DSA pattern actually used by the submitted code.

          14. Keep the explanation useful for future DSA revision.

          15. Do NOT rewrite the original problem statement.

          16. Do NOT repeat the full README.

          17. Return ONLY Markdown.

          18. Do NOT wrap the entire response in a code fence.

          19. Start exactly with:

          ## 🧠 AI Explanation

          Use exactly these sections:

          ## 🧠 AI Explanation

          ### 💡 Intuition

          Explain the key idea behind the user's actual solution in simple
          language.

          ### 🔍 Approach

          Explain the user's actual approach step-by-step.

          ### 🧩 Algorithm

          Describe the exact algorithm implemented in the submitted code.

          If it uses DP, explain the actual state, transition, base cases,
          and iteration order.

          If it uses DFS/BFS, explain the actual traversal and state.

          If it uses two pointers, sliding window, binary search, stack,
          queue, hashing, greedy logic, recursion, backtracking, math,
          bit manipulation, etc., explain exactly how the submitted code
          uses it.

          Do not invent concepts that are not present in the code.

          ### ✅ Why This Works

          Explain why the actual submitted implementation produces the
          correct result.

          Give a concise correctness argument based on the code.

          ### ⏱️ Complexity

          Give the time complexity of the ACTUAL implementation.

          Give the space complexity of the ACTUAL implementation.

          Explain where those complexities come from.

          ### 🧠 DSA Pattern

          Identify the main DSA pattern or technique actually used.

          ### ⚠️ Common Mistakes

          List mistakes that are relevant to THIS problem and THIS approach.

          Do not give unrelated generic advice.

          ### 🚀 Optimization Notes

          Mention useful implementation or optimization details that are
          actually relevant to the submitted solution.

          If the submitted solution is already efficient, say so.

          If there is a genuine weakness, explain it clearly without replacing
          the solution with a completely different approach.

          =========================
          EXISTING PROBLEM README
          =========================

          {readme}

          =========================
          USER'S ACTUAL SUBMITTED SOLUTION
          =========================

          {solution}
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.25,
                  "maxOutputTokens": 5000
              }
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Gemini API request failed.")
              print(f"HTTP status: {e.code}")
              print(error_body)

              raise

          except urllib.error.URLError as e:
              raise RuntimeError(
                  f"Could not connect to Gemini API: {e}"
              )

          try:
              candidates = result.get("candidates", [])

              if not candidates:
                  print(json.dumps(result, indent=2))
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              content = candidates[0].get("content", {})
              parts = content.get("parts", [])

              explanation = "\n".join(
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict) and "text" in part
              ).strip()

          except (KeyError, IndexError, TypeError):
              print(json.dumps(result, indent=2))
              raise RuntimeError(
                  "Gemini returned an unexpected response."
              )

          if not explanation:
              print(json.dumps(result, indent=2))
              raise RuntimeError(
                  "Gemini returned an empty explanation."
              )

          marker = "## 🧠 AI Explanation"

          # Remove any previous AI explanation and replace it
          # with the newly generated explanation.
          if marker in readme:
              readme = (
                  readme.split(marker, 1)[0]
                  .rstrip()
                  + "\n\n"
                  + explanation
                  + "\n"
              )
          else:
              readme = (
                  readme.rstrip()
                  + "\n\n---\n\n"
                  + explanation
                  + "\n"
              )

          with open(
              readme_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(readme)

          print(f"Successfully updated {readme_file}")
          PY

      - name: Commit AI explanation
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.problem.outputs.readme_file }}"

          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "docs: add AI explanation"

          git push
