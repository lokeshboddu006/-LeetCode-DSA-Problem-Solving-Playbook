name: Generate AI Explanation

on:
  push:
    branches:
      - main
    paths:
      - "**/*.java"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.cc"
      - "**/*.cxx"
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.go"
      - "**/*.rs"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.cs"
      - "**/*.php"
      - "**/*.swift"
      - "**/*.rb"
      - "**/*.scala"
      - "**/*.dart"
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.hs"
      - "**/*.lua"
      - "**/*.pl"
      - "**/*.r"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Find the solution file and matching README
      # ---------------------------------------------------------
      - name: Find problem to explain
        id: problem
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual run detected."

            FILE=$(
              find . \
                -type f \
                \( \
                  -name "*.java" \
                  -o -name "*.c" \
                  -o -name "*.cpp" \
                  -o -name "*.cc" \
                  -o -name "*.cxx" \
                  -o -name "*.py" \
                  -o -name "*.js" \
                  -o -name "*.ts" \
                  -o -name "*.go" \
                  -o -name "*.rs" \
                  -o -name "*.kt" \
                  -o -name "*.kts" \
                  -o -name "*.cs" \
                  -o -name "*.php" \
                  -o -name "*.swift" \
                  -o -name "*.rb" \
                  -o -name "*.scala" \
                  -o -name "*.dart" \
                  -o -name "*.ex" \
                  -o -name "*.exs" \
                  -o -name "*.hs" \
                  -o -name "*.lua" \
                  -o -name "*.pl" \
                  -o -name "*.r" \
                \) \
                -not -path "./.git/*" \
                -printf '%T@ %p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
            )

          else

            echo "Push event detected."

            FILES=$(
              git diff --name-only \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                -- \
                '*.java' \
                '*.c' \
                '*.cpp' \
                '*.cc' \
                '*.cxx' \
                '*.py' \
                '*.js' \
                '*.ts' \
                '*.go' \
                '*.rs' \
                '*.kt' \
                '*.kts' \
                '*.cs' \
                '*.php' \
                '*.swift' \
                '*.rb' \
                '*.scala' \
                '*.dart' \
                '*.ex' \
                '*.exs' \
                '*.hs' \
                '*.lua' \
                '*.pl' \
                '*.r' \
              || true
            )

            FILE=$(echo "$FILES" | head -n 1 || true)

          fi

          if [ -z "${FILE:-}" ]; then
            echo "No supported solution file was found."
            exit 1
          fi

          PROBLEM_DIR=$(dirname "$FILE")
          README="$PROBLEM_DIR/README.md"

          if [ ! -f "$README" ]; then
            echo "README.md not found."
            echo "Solution: $FILE"
            echo "Expected README: $README"
            exit 1
          fi

          echo "----------------------------------------"
          echo "Solution: $FILE"
          echo "Problem directory: $PROBLEM_DIR"
          echo "README: $README"
          echo "----------------------------------------"

          {
            echo "solution_file=$FILE"
            echo "problem_dir=$PROBLEM_DIR"
            echo "readme_file=$README"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 3. Generate AI explanation
      # ---------------------------------------------------------
      - name: Generate AI explanation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOLUTION_FILE: ${{ steps.problem.outputs.solution_file }}
          README_FILE: ${{ steps.problem.outputs.readme_file }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          # -----------------------------------------------------
          # Configuration
          # -----------------------------------------------------

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()

          SOLUTION_FILE = os.environ["SOLUTION_FILE"]
          README_FILE = os.environ["README_FILE"]

          # Current Gemini model.
          MODEL = "gemini-3.6-flash"

          # -----------------------------------------------------
          # Validate API key
          # -----------------------------------------------------

          if not API_KEY:
              raise RuntimeError(
                  "GEMINI_API_KEY GitHub Secret is missing."
              )

          # -----------------------------------------------------
          # Read solution
          # -----------------------------------------------------

          print(f"Reading solution: {SOLUTION_FILE}")

          with open(
              SOLUTION_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              solution = f.read()

          # -----------------------------------------------------
          # Read README
          # -----------------------------------------------------

          print(f"Reading README: {README_FILE}")

          with open(
              README_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              readme = f.read()

          # -----------------------------------------------------
          # AI prompt
          # -----------------------------------------------------

          prompt = f"""
          You are an expert competitive programming mentor and DSA
          revision assistant.

          Your job is to explain ONLY the user's ACTUAL SUBMITTED
          SOLUTION.

          The submitted source code is the source of truth for the
          implementation.

          The user wants to understand THEIR OWN solution months or
          years later when revising the problem.

          ============================================================
          STRICT RULES
          ============================================================

          1. Explain ONLY the submitted solution and the approach
             actually implemented in that source code.

          2. DO NOT replace the user's approach with the canonical
             LeetCode solution.

          3. DO NOT suggest a completely different algorithm.

          4. DO NOT suggest a different data structure as an
             alternative solution.

          5. DO NOT compare the user's solution with other people's
             solutions.

          6. DO NOT solve the problem independently and then explain
             a different solution.

          7. DO NOT invent implementation details.

          8. Every explanation must be grounded in the actual
             submitted source code.

          9. If the submitted solution has a weakness, limitation,
             unnecessary operation, edge-case risk, readability issue,
             or implementation concern, mention it honestly.

          10. Weaknesses must refer to the ACTUAL submitted solution.

          11. Do NOT criticize the solution merely because another
              approach exists.

          12. If the solution is already optimal for the problem,
              say so when appropriate.

          13. Do NOT repeat the original problem statement.

          14. The existing README contains the original problem
              statement and possibly other repository information.
              Use it only to understand the problem context.

          15. The explanation should teach the user how THEIR code
              works.

          16. Pay attention to:
              - variables
              - loops
              - conditions
              - data structures
              - helper methods
              - recursion
              - DP states
              - transitions
              - invariants
              - greedy choices
              - graph traversal
              - binary search conditions
              - mathematical observations
              - overflow handling
              - edge cases
              - implementation-specific optimizations

          17. Do not hallucinate code that does not exist.

          18. If something cannot be determined from the code, say
              that it cannot be determined instead of inventing it.

          19. Return ONLY Markdown.

          20. Do NOT wrap the entire response in a code fence.

          21. Start EXACTLY with:

          ## 🧠 AI Explanation

          ============================================================
          REQUIRED FORMAT
          ============================================================

          ## 🧠 AI Explanation

          ### 💡 Intuition

          Explain the key observation behind THIS submitted solution
          in simple language.

          Explain why the user's implementation works conceptually.

          ### 🔍 Approach

          Explain the user's actual approach step-by-step.

          Follow the flow of the submitted source code.

          Explain important variables, loops, conditions, helper
          functions, recursion, data structures, or other relevant
          implementation details.

          ### 🧩 Algorithm

          Give the exact algorithm implemented by the user.

          If applicable, include:
          - recurrence
          - DP state
          - transition
          - invariant
          - greedy rule
          - binary-search condition
          - graph traversal
          - mathematical transformation

          Do NOT introduce an algorithm that the user did not implement.

          ### ✅ Why This Works

          Give a concise correctness explanation for the user's
          actual implementation.

          Explain why the important steps preserve correctness and
          why the final result is correct.

          ### ⏱️ Complexity

          State:

          - Time complexity
          - Space complexity

          Explain where those complexities come from in THIS code.

          ### 🧠 DSA Pattern

          Identify the main DSA pattern used by THIS solution.

          Examples include:

          - Dynamic Programming
          - Greedy
          - Binary Search
          - DFS
          - BFS
          - Backtracking
          - Two Pointers
          - Sliding Window
          - Stack
          - Queue
          - Hashing
          - Heap / Priority Queue
          - Graph
          - Union Find
          - Trie
          - Prefix Sum
          - Monotonic Stack
          - Bit Manipulation
          - Math
          - Recursion
          - Divide and Conquer

          ### ⚠️ Common Mistakes

          List important mistakes someone could make while
          implementing or understanding THIS solution.

          Focus on mistakes relevant to the actual code.

          ### 🚀 Optimization Notes

          Mention useful implementation or performance details
          relevant to THIS submitted solution.

          Only mention optimizations that are actually relevant.

          If there is nothing meaningful to optimize, say so.

          ============================================================
          ORIGINAL PROBLEM README
          ============================================================

          {readme}

          ============================================================
          USER'S ACTUAL SUBMITTED SOLUTION
          ============================================================

          {solution}
          """

          # -----------------------------------------------------
          # Gemini API endpoint
          # -----------------------------------------------------

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              f"models/{MODEL}:generateContent"
          )

          # -----------------------------------------------------
          # Request payload
          # -----------------------------------------------------

          payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "maxOutputTokens": 5000
              }
          }

          data = json.dumps(payload).encode("utf-8")

          # -----------------------------------------------------
          # HTTP request
          # -----------------------------------------------------

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
              },
              method="POST"
          )

          print(f"Calling Gemini model: {MODEL}")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  response_body = response.read().decode(
                      "utf-8"
                  )

                  result = json.loads(response_body)

          except urllib.error.HTTPError as e:

              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("----------------------------------------")
              print("Gemini API request failed.")
              print(f"HTTP status: {e.code}")
              print(error_body)
              print("----------------------------------------")

              raise

          except urllib.error.URLError as e:

              raise RuntimeError(
                  f"Could not connect to Gemini API: {e}"
              )

          # -----------------------------------------------------
          # Extract generated explanation
          # -----------------------------------------------------

          try:

              candidates = result["candidates"]

              if not candidates:
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              content = candidates[0]["content"]

              parts = content["parts"]

              explanation = "\n".join(
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict)
                  and "text" in part
              ).strip()

          except (
              KeyError,
              IndexError,
              TypeError
          ):

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Gemini returned an unexpected response."
              )

          if not explanation:
              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Gemini returned an empty explanation."
              )

          # -----------------------------------------------------
          # Make sure the generated section starts correctly
          # -----------------------------------------------------

          marker = "## 🧠 AI Explanation"

          if marker in explanation:

              explanation = (
                  marker
                  + explanation.split(marker, 1)[1]
              )

          else:

              explanation = (
                  marker
                  + "\n\n"
                  + explanation
              )

          # -----------------------------------------------------
          # Replace previous AI explanation if one exists
          # -----------------------------------------------------

          if marker in readme:

              readme = (
                  readme.split(marker, 1)[0]
                  .rstrip()
                  + "\n\n"
                  + explanation.strip()
                  + "\n"
              )

          else:

              readme = (
                  readme.rstrip()
                  + "\n\n---\n\n"
                  + explanation.strip()
                  + "\n"
              )

          # -----------------------------------------------------
          # Write README
          # -----------------------------------------------------

          with open(
              README_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(readme)

          print("----------------------------------------")
          print(f"Updated: {README_FILE}")
          print("----------------------------------------")

          PY

      # ---------------------------------------------------------
      # 4. Commit generated explanation
      # ---------------------------------------------------------
      - name: Commit AI explanation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          README_FILE="${{ steps.problem.outputs.readme_file }}"

          git add "$README_FILE"

          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi

          git commit -m "docs: add AI explanation"

          git push
