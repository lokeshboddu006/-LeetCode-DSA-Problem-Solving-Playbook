name: Generate AI Explanation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.java'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.go'
      - '**/*.rs'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - '**/*.cs'
      - '**/*.php'
      - '**/*.rb'
      - '**/*.scala'
      - '**/*.dart'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find problem to explain
        id: problem
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="$(
              git log -1 --name-only --pretty=format: -- \
                '*.java' '*.c' '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' \
                '*.py' '*.js' '*.ts' '*.go' '*.rs' '*.kt' '*.kts' \
                '*.swift' '*.cs' '*.php' '*.rb' '*.scala' '*.dart' |
              grep -E '\.(java|c|cpp|cc|cxx|h|hpp|py|js|ts|go|rs|kt|kts|swift|cs|php|rb|scala|dart)$' |
              head -n 1 || true
            )"
          else
            FILE="$(
              git diff --name-only --diff-filter=AM \
                "${{ github.event.before }}" \
                "${{ github.sha }}" \
                -- \
                '*.java' '*.c' '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' \
                '*.py' '*.js' '*.ts' '*.go' '*.rs' '*.kt' '*.kts' \
                '*.swift' '*.cs' '*.php' '*.rb' '*.scala' '*.dart' |
              grep -E '\.(java|c|cpp|cc|cxx|h|hpp|py|js|ts|go|rs|kt|kts|swift|cs|php|rb|scala|dart)$' |
              head -n 1 || true
            )"
          fi

          if [ -z "$FILE" ]; then
            echo "No supported source-code solution was found."
            exit 1
          fi

          PROBLEM_DIR="$(dirname "$FILE")"
          README="$PROBLEM_DIR/README.md"

          if [ ! -f "$README" ]; then
            echo "README.md not found next to solution:"
            echo "  $FILE"
            echo "Expected:"
            echo "  $README"
            exit 1
          fi

          echo "Solution: $FILE"
          echo "Problem directory: $PROBLEM_DIR"
          echo "README: $README"

          {
            echo "solution_file=$FILE"
            echo "problem_dir=$PROBLEM_DIR"
            echo "readme_file=$README"
          } >> "$GITHUB_OUTPUT"

      - name: Generate AI explanation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOLUTION_FILE: ${{ steps.problem.outputs.solution_file }}
          README_FILE: ${{ steps.problem.outputs.readme_file }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          solution_file = os.environ["SOLUTION_FILE"]
          readme_file = os.environ["README_FILE"]

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY GitHub Secret is missing."
              )

          with open(solution_file, "r", encoding="utf-8") as f:
              solution = f.read()

          with open(readme_file, "r", encoding="utf-8") as f:
              readme = f.read()

          prompt = f"""
          You are the DSA revision assistant for a personal LeetCode problem-solving
          playbook.

          Your ONLY job is to explain the user's ACTUAL SUBMITTED SOLUTION below.

          The submitted source code is the source of truth for the implementation.
          The user wants to understand THEIR OWN solution months or years later.

          STRICT RULES:

          1. Explain ONLY the submitted solution and the approach actually implemented.

          2. Do NOT replace the user's approach with the canonical LeetCode solution.

          3. Do NOT suggest a completely different algorithm as the main approach.

          4. Do NOT compare the user's solution with other people's solutions.

          5. Do NOT solve the problem independently and then explain a different
             solution.

          6. Do NOT invent implementation details that are not present in the code.

          7. Do NOT claim that the code uses a technique unless the code actually does.

          8. Do NOT rewrite or repeat the original problem statement from the README.

          9. If the submitted solution is inefficient, fragile, unusual, or has a real
             weakness, say so honestly, but keep the discussion tied to THIS solution.

          10. Optimization Notes may mention improvements to THIS implementation only.
              Do not turn them into a different solution.

          11. Explain the actual variables, loops, conditions, data structures,
              recursion, DP states, invariants, or other important mechanisms when
              they are relevant.

          12. Make the explanation useful for DSA revision months later.

          13. Return ONLY Markdown.

          14. Do NOT wrap the complete answer in a code fence.

          15. Start exactly with:
              ## 🧠 AI Explanation

          Use exactly these sections:

          ## 🧠 AI Explanation

          ### 💡 Intuition

          Explain the key idea behind THIS submitted solution in simple language.
          Do not introduce a different approach.

          ### 🔍 Approach

          Explain step-by-step how THIS solution processes the input and reaches
          the answer.

          ### 🧩 Algorithm

          Describe the exact algorithm implemented in the submitted code.
          Include recurrence, state, invariant, or other important details
          when applicable.

          ### 🔎 Code Walkthrough

          Walk through the important parts of the submitted code and explain what
          they do. Focus on the parts that matter for understanding the algorithm.

          ### ✅ Why This Works

          Give a concise correctness argument for THIS implementation.

          ### ⏱️ Complexity

          State the time and space complexity of THIS submitted solution.
          Explain where those costs come from.

          ### 🧠 DSA Pattern

          Identify the DSA pattern or technique actually used by THIS solution.

          ### ⚠️ Weak Points & Common Mistakes

          Mention real weaknesses, edge cases, assumptions, or common mistakes
          related to THIS solution.

          Do not invent weaknesses.

          ### 🚀 Optimization Notes

          Mention only relevant optimizations or implementation improvements
          for THIS solution.

          If there is nothing meaningful to optimize, say so briefly.

          =========================
          EXISTING PROBLEM README
          =========================

          {readme}

          =========================
          USER'S ACTUAL SUBMITTED SOLUTION
          =========================

          {solution}
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent"
          )

          payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 5000
              }
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Gemini API request failed.")
              print(f"HTTP status: {e.code}")
              print(error_body)

              raise

          except urllib.error.URLError as e:
              raise RuntimeError(
                  f"Could not connect to Gemini API: {e}"
              ) from e

          try:
              candidates = result.get("candidates", [])

              if not candidates:
                  print(
                      json.dumps(
                          result,
                          indent=2
                      )
                  )

                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              content = candidates[0].get(
                  "content",
                  {}
              )

              parts = content.get(
                  "parts",
                  []
              )

              explanation = "\n".join(
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict)
                  and part.get("text")
              ).strip()

          except (
              AttributeError,
              TypeError,
              IndexError
          ) as e:

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Gemini returned an unexpected response."
              ) from e

          if not explanation:
              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Gemini returned an empty explanation."
              )

          marker = "## 🧠 AI Explanation"

          if marker in readme:
              readme = (
                  readme.split(
                      marker,
                      1
                  )[0]
                  .rstrip()
                  + "\n\n"
                  + explanation
                  + "\n"
              )

          else:
              readme = (
                  readme.rstrip()
                  + "\n\n---\n\n"
                  + explanation
                  + "\n"
              )

          with open(
              readme_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(readme)

          print(
              f"Updated {readme_file}"
          )
          PY

      - name: Commit AI explanation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.problem.outputs.readme_file }}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: add AI explanation"

          git push
