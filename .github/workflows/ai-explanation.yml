name: Generate AI Explanation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed solution
        id: find_solution
        shell: bash
        run: |
          echo "Looking for changed solution files..."

          FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)

          SOLUTION=""

          while IFS= read -r file; do
            case "$file" in
              *.py|*.java|*.cpp|*.cc|*.cxx|*.js|*.ts|*.go|*.rs|*.kt|*.swift|*.cs)
                if [[ "$file" != .github/* ]]; then
                  SOLUTION="$file"
                  break
                fi
                ;;
            esac
          done <<< "$FILES"

          if [ -z "$SOLUTION" ]; then
            echo "No solution file found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found solution: $SOLUTION"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$SOLUTION" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate README with Gemini
        if: steps.find_solution.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOLUTION_FILE: ${{ steps.find_solution.outputs.file }}
        shell: python
        run: |
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          solution_file = Path(os.environ["SOLUTION_FILE"])

          # Read the submitted solution
          code = solution_file.read_text(encoding="utf-8")

          # Find the problem directory
          problem_dir = solution_file.parent

          # Read existing LeetSync README if it exists.
          # This helps Gemini understand the original problem.
          existing_readme = ""

          readme_path = problem_dir / "README.md"

          if readme_path.exists():
              existing_readme = readme_path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          prompt = f"""
          You are an expert Data Structures and Algorithms instructor.

          I have solved a LeetCode problem and the solution was accepted.

          Your job is to create a HIGH-QUALITY GitHub README explaining
          the ACTUAL submitted solution.

          IMPORTANT RULES:

          1. Explain the submitted code, not a different solution.
          2. Do not modify or rewrite the solution.
          3. Do not invent a better algorithm.
          4. If the existing README contains the LeetCode problem statement,
             use it to understand the problem.
          5. Keep the explanation beginner-friendly but technically accurate.
          6. Return ONLY Markdown.
          7. Do not put the entire solution code into the README.
          8. Make the README professional enough for a DSA portfolio.

          Generate these sections:

          # Problem

          Briefly explain what the problem asks.

          ## Example

          Give a simple example if the problem information is available.

          ## Intuition

          Explain the key idea behind the submitted solution.

          ## Approach

          Explain the approach step-by-step.

          ## Algorithm

          Give the algorithm as numbered steps.

          ## Why This Works

          Explain why the algorithm produces the correct answer.

          ## Complexity

          Give:
          - Time Complexity
          - Space Complexity

          Explain why those complexities apply to THIS submitted code.

          ## Code Explanation

          Explain the important parts of the submitted code in a
          beginner-friendly way.

          ## Edge Cases

          Mention important edge cases handled by the solution.

          Here is the existing README/problem information:

          --- EXISTING README ---
          {existing_readme}
          --- END EXISTING README ---

          Here is the ACTUAL ACCEPTED SOLUTION:

          --- SOLUTION ---
          {code}
          --- END SOLUTION ---

          Remember:
          Return ONLY the final Markdown README.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          body = json.dumps(data).encode("utf-8")

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )

          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode("utf-8"))

          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="ignore")
              print("Gemini API request failed:")
              print(error_body)
              raise

          except Exception as e:
              print("Unexpected error:")
              print(str(e))
              raise

          try:
              parts = result["candidates"][0]["content"]["parts"]

              explanation = "\n".join(
                  part.get("text", "")
                  for part in parts
                  if part.get("text")
              ).strip()

          except (KeyError, IndexError, TypeError) as e:
              print("Unexpected Gemini response:")
              print(json.dumps(result, indent=2))
              raise RuntimeError(
                  "Could not extract Gemini response."
              ) from e

          if not explanation:
              raise RuntimeError("Gemini returned an empty explanation.")

          # Remove accidental Markdown code fences if Gemini adds them.
          if explanation.startswith("```markdown"):
              explanation = explanation[len("```markdown"):].strip()

          if explanation.endswith("```"):
              explanation = explanation[:-3].rstrip()

          readme_path.write_text(
              explanation + "\n",
              encoding="utf-8"
          )

          print(f"Generated README: {readme_path}")

      - name: Commit AI-generated README
        if: steps.find_solution.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "docs: add AI explanation"
          git push
